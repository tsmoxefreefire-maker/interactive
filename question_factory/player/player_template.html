<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصنع الأسئلة التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=Noto+Kufi+Arabic:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--panel:#FFFFFF;--ink:#17222D;--muted:#5C6A77;--line:#D6DEE6;--chip:#EDF1F5;--brand:#1F6F78;--good:#2E8B57;--bad:#C8473D;--warn:#B9770E;--focus:#1F6F78;
  --water:#3A8DDE;--leaf:#2F8F4E;--soil:#7A4D2B;--sun:#F2B33D;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E151B;--panel:#151F28;--ink:#E4ECF2;--muted:#9AAAB8;--line:#283643;--chip:#1C2834;--brand:#4FB3BD;--good:#4CB36E;--bad:#E2685E;--warn:#E3B44F;--focus:#7FD0D8;--water:#62A8EE;--leaf:#4CB36E}}
:root[data-theme="dark"]{--bg:#0E151B;--panel:#151F28;--ink:#E4ECF2;--muted:#9AAAB8;--line:#283643;--chip:#1C2834;--brand:#4FB3BD;--good:#4CB36E;--bad:#E2685E;--warn:#E3B44F;--focus:#7FD0D8;--water:#62A8EE;--leaf:#4CB36E}
/* garden skin: the same games, a look that fits plant lessons */
body.skin-garden{--brand:#2F8F4E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.skin-garden{--brand:#4CB36E}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7}
h1,h2,h3{font-family:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;line-height:1.35}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
.hero{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;margin-bottom:16px}
.hero h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}
.hero p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem}
.pipe span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.pipe i{font-style:normal;color:var(--muted)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.layout>*{min-width:0}
.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto}
@media (max-width:860px){.side{position:relative;top:0;max-height:260px}}
.side h3{font-size:.95rem;margin:8px 4px 6px;color:var(--muted)}
.tree{font-size:.85rem;font-weight:700;color:var(--muted);padding:6px 10px 2px}
.tree.t{padding-inline-start:18px}.tree.t::before{content:'◇ '}
.les{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:right;border:0;background:transparent;border-radius:10px;padding:7px 10px 7px 10px;padding-inline-start:28px;cursor:pointer}
.les span{overflow-wrap:anywhere}
.les:hover{background:var(--chip)}
.les[aria-current="true"]{background:var(--brand);color:#fff}
.les small{opacity:.8;white-space:nowrap}
.main{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.lhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.lhead h2{font-size:1.35rem}
.status{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--warn) 18%,var(--panel))}
.cov{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.cov.miss{background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.small{color:var(--muted);font-size:.9rem}
.sec{font-size:.95rem;margin:14px 0 8px;color:var(--muted)}
.stations{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.station{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:6px 12px;cursor:pointer;display:grid;text-align:center;min-width:86px}
.station.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.station .st{letter-spacing:2px;color:var(--warn);font-size:.95rem}
.station small{color:var(--muted);font-size:.75rem}
.link{width:16px;height:3px;background:var(--line);border-radius:2px}
.qtabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qtab{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.qtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qtab.done::after{content:" ✓";color:var(--good);font-weight:800}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.diff{font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
.diff.easy{background:var(--good)}.diff.mid{background:var(--warn)}.diff.hard{background:var(--bad)}
.qtext{font-family:"Noto Kufi Arabic",sans-serif;font-size:1.12rem;font-weight:800;margin:8px 0 2px}
.how{color:var(--muted);margin:0 0 12px}
.feedback{min-height:1.6em;margin-top:10px;font-weight:700}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.tests{margin-top:6px;font-size:.86rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.btn{border:0;border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:700;background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 13px;cursor:pointer;font-weight:700;direction:auto}
.chip.used{opacity:.3;pointer-events:none}
.chip.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.chip.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.solution{margin-top:14px;border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--good) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 30%,var(--line))}
.solution h3{font-size:1rem;margin-bottom:6px}
.solution ol{margin:0;padding-inline-start:1.3em}
.solution li{direction:auto}
.stars{letter-spacing:2px;color:var(--warn)}
.code{direction:ltr;text-align:left;background:var(--chip);border-radius:12px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.5;overflow:auto;max-height:280px;white-space:pre}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 12px;cursor:pointer;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ===== shared fun ===== */
#q{position:relative;overflow:hidden}
.conf{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall 1.3s ease-in forwards;z-index:5}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes dance{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.drag{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.drag-ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) scale(1.06);opacity:.96;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.over{outline:3px dashed var(--warn)!important;outline-offset:3px}
/* mascot «بذور» */
.mascot{position:absolute;inset-inline-end:14px;top:10px;flex-direction:row-reverse;display:flex;align-items:center;gap:6px;z-index:6;pointer-events:none}
.mascot .m-body{font-size:2rem;display:inline-block;transform-origin:50% 90%}
.mascot .m-say{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:3px 10px;font-size:.85rem;font-weight:700;opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.mascot.talk .m-say{opacity:1;transform:scale(1)}
.mascot.happy .m-body{animation:dance .5s 3}
.mascot.oops .m-body{animation:wiggle .3s 3}
.mascot.dive .m-body{animation:dive 1.2s}
@keyframes dive{40%{transform:translateY(30px) rotate(160deg)}100%{transform:translateY(0) rotate(360deg)}}
@media (max-width:520px){.mascot .m-say{white-space:normal;max-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.conf{display:none}}
</style>
<style>
/* ---------- 1. مين الصادق؟ (meaning) ---------- */
.namecard{display:block;width:max-content;margin:44px auto 12px;font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:1.2rem;border-radius:14px;padding:8px 18px;background:var(--brand);color:#fff}
.faces{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fcard{position:relative;border:2px solid var(--line);border-radius:18px;padding:10px 10px 12px;background:color-mix(in srgb,var(--chip) 70%,var(--panel));cursor:pointer;display:grid;justify-items:center;gap:6px;text-align:center;transition:opacity .4s,transform .6s}
.fcard .ftxt{font-size:.92rem;direction:auto}
.face{position:relative;width:64px;height:64px;border-radius:50%;animation:bob 2.6s ease-in-out infinite}
.fcard:nth-child(2) .face{animation-delay:-.6s}.fcard:nth-child(3) .face{animation-delay:-1.2s}.fcard:nth-child(4) .face{animation-delay:-1.8s}
.eye{position:absolute;top:20px;width:15px;height:15px;border-radius:50%;background:#fff;overflow:hidden;animation:blink 4s infinite}
.eye.l{left:13px}.eye.r{right:13px}
.pupil{position:absolute;left:4px;top:4px;width:7px;height:7px;border-radius:50%;background:#1b1b1b;transition:transform .08s}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.mouth{position:absolute;left:50%;bottom:12px;width:22px;height:9px;margin-left:-11px;border-radius:0 0 12px 12px;background:#3b1d1d}
.talking .mouth{animation:talk .25s infinite alternate}
@keyframes talk{to{height:3px;border-radius:6px}}
.nose{position:absolute;left:50%;top:30px;width:11px;height:10px;margin-left:-5px;border-radius:5px 9px 9px 5px;background:inherit;border:2px solid rgba(0,0,0,.18);box-shadow:inset -3px -2px 0 rgba(0,0,0,.08);filter:brightness(.96);z-index:1;transform-origin:0 50%;transition:width 1.2s cubic-bezier(.3,1.6,.5,1)}
.fcard.liar .nose{width:46px}
.bubble-say{position:absolute;top:-14px;inset-inline-end:-6px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:2px 9px;font-size:.78rem;font-weight:800;white-space:nowrap;animation:pop .3s}
.fcard.truth{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.fcard.truth .face{animation:dance .5s 4}
.fcard.away{opacity:.25;transform:translateY(16px) scale(.94)}
.fcard.laugh .face{animation:wiggle .2s 6}
@media (max-width:520px){.faces{grid-template-columns:1fr 1fr;gap:10px}.face{width:54px;height:54px}.eye{top:16px}.mouth{bottom:9px}}

/* ---------- 2. وصّل (match) = بذرة ← ساق ← برعم ---------- */
.mwrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px 40px;margin-top:6px}
.mwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:grid;gap:10px;align-content:start}
.mterm,.mdef{border:2px solid var(--line);background:var(--chip);border-radius:14px;padding:10px 12px;text-align:start;direction:auto;display:flex;gap:8px;align-items:center}
.mterm{font-weight:800}
.mterm .ic,.mdef .ic{font-size:1.4rem;flex:none;display:inline-block}
.mterm[aria-pressed="true"]{border-color:var(--warn)}
.mterm.ok,.mdef.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--panel))}
.mdef.bloom .ic{animation:pop .6s}
.leaf-fall{position:absolute;font-size:1.3rem;pointer-events:none;animation:leaffall 1.4s ease-in forwards;z-index:4}
@keyframes leaffall{to{transform:translate(-30px,120px) rotate(220deg);opacity:0}}
.flow{stroke-dasharray:4 10;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.droop{transition:all .7s ease-in;opacity:0}

/* ---------- 3. بطاقات الذاكرة ---------- */
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;perspective:800px}
@media (max-width:520px){.mem{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mc{position:relative;min-height:96px;border:0;background:none;padding:0;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.mc.open{transform:rotateY(180deg)}
.mc .side-a,.mc .side-b{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;padding:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--line)}
.mc .side-a{background:color-mix(in srgb,var(--brand) 20%,var(--panel));font-size:2rem}
.mc .side-b{background:var(--chip);transform:rotateY(180deg);font-size:.88rem;font-weight:700;direction:auto}
.mc.done .side-b{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.mc.oops{animation:wiggle .25s 3}

/* ---------- 4. ركّب الاسم ---------- */
.clue{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--warn) 12%,var(--panel));font-weight:700;margin-bottom:12px;direction:auto}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.lslot{width:46px;height:52px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--bg)}
.lslot.filled{border-style:solid;border-color:var(--brand)}
.lslot.gap{border:0;background:none;width:18px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:46px;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--chip);font-size:1.5rem;font-weight:800;cursor:pointer;display:grid;place-items:center;position:relative}
.skin-garden .tile{border-radius:50% 4px 50% 4px;background:color-mix(in srgb,var(--leaf) 22%,var(--panel))}
.tile.spin{animation:spinback .6s}
@keyframes spinback{50%{transform:rotate(200deg) scale(.8)}}
.word-done{font-family:"Noto Kufi Arabic",sans-serif;font-size:2rem;font-weight:800;text-align:center;color:var(--good);animation:pop .6s}

/* ---------- 5. صح ولا غلط (سحب البطاقة) ---------- */
.tfzone{position:relative;display:grid;place-items:center;min-height:210px;margin:6px 0 10px;padding:0 64px}
#deck{display:grid;width:100%;justify-items:center}
.tfside{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:1.05rem;opacity:.75;pointer-events:none}
.tfside.yes{right:0;color:var(--good)}.tfside.no{left:0;color:var(--bad)}
.tfcard{grid-area:1/1;position:relative;width:min(320px,100%);min-height:170px;border-radius:18px;border:2px solid var(--line);background:var(--panel);box-shadow:0 8px 20px rgba(0,0,0,.08);display:grid;place-items:center;padding:26px 16px 16px;text-align:center;font-weight:700;direction:auto;touch-action:none;cursor:grab;transition:transform .35s,opacity .35s}
.tfcard.under{transform:translateY(8px) scale(.96);opacity:.6}
.tfcard .tfn{position:absolute;top:8px;inset-inline-start:12px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.tfzone{padding:0 46px}.tfside{font-size:.85rem}}
.tfbtns{display:flex;justify-content:center;gap:12px}

/* ---------- 6. الجسر ---------- */
.stage{display:block;width:100%;height:auto;margin:8px 0}
.stage.small{max-width:380px;margin:8px auto}
.chip.star{border-color:var(--warn)}
#br{max-width:640px;margin:8px auto}
#br .plank{cursor:pointer}
.bridge-shake{animation:bshake .5s}
@keyframes bshake{20%{transform:translate(-4px,1px)}40%{transform:translate(4px,-1px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}

/* ---------- 7. صلّح السلسلة (القطار) ---------- */
.train{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;justify-content:center;padding:10px 0 4px;transition:transform 1.6s ease-in}
.wagon{position:relative;border:2px solid var(--line);background:var(--chip);border-radius:12px 12px 6px 6px;padding:10px 12px 18px;min-width:86px;text-align:center;font-weight:800;cursor:pointer;direction:auto}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:-9px;width:16px;height:16px;border-radius:50%;background:#333;border:3px solid #888}
.wagon::before{left:12px}.wagon::after{right:12px}
.wagon.engine{background:color-mix(in srgb,var(--brand) 25%,var(--panel));cursor:default}
.wagon.gap{border-style:dashed;background:transparent;color:var(--muted)}
.wagon.picked{border-color:var(--bad)}
.wagon.honk{animation:shake .4s}
.wagon .say{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:1px 8px;font-size:.78rem;white-space:nowrap;animation:pop .3s}
.train.go{transform:translateX(-120%)}

/* ---------- 8. الباب بوجه ---------- */
.doorbox{position:relative;width:min(300px,90%);margin:6px auto 10px;height:230px;perspective:900px}
.behind{position:absolute;inset:14px 34px 0;border-radius:10px;background:color-mix(in srgb,var(--sun) 30%,var(--panel));display:grid;place-items:center;align-content:center;gap:6px;text-align:center;padding:8px}
.behind .who{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:1.15rem;border-radius:12px;padding:4px 12px;background:var(--brand);color:#fff;opacity:0;transform:scale(.5);transition:all .5s .4s}
.behind .friends{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.behind .friends span{border-radius:10px;padding:2px 8px;background:var(--panel);font-weight:700;font-size:.85rem;animation:pop .5s}
.behind .line{font-weight:700;font-size:.9rem;opacity:0;transition:opacity .4s .9s}
.door{position:absolute;inset:14px 34px 0;border-radius:10px;background:#8B5A2B;border:6px solid #5E3A1F;transform-origin:left center;transition:transform 1.1s ease-in-out;display:grid;justify-items:center;align-content:start;padding-top:18px;gap:4px}
.skin-garden .door{background:repeating-linear-gradient(90deg,#7A4D2B 0 12px,#6d4426 12px 14px);border-color:#4f2f17}
.door .dface{position:relative;width:96px;height:56px}
.door .eye{top:4px;width:20px;height:20px}.door .eye.l{left:16px}.door .eye.r{right:16px}
.door .pupil{left:6px;top:6px;width:9px;height:9px}
.door .mouth{bottom:2px;width:30px;margin-left:-15px;height:11px}
.door .dname{color:#fff;font-weight:800;font-size:1rem;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.door .locks{display:flex;gap:6px;font-size:1.6rem}
.door .lk.drop{animation:lockdrop .8s forwards}
@keyframes lockdrop{to{transform:translateY(120px) rotate(70deg);opacity:0}}
.door.giggle{animation:wiggle .18s 6}
.doorbox.open .door{transform:rotateY(-105deg)}
.doorbox.open .who,.doorbox.open .line{opacity:1;transform:none}
.keys .chip::before{content:"🔑 "}
.chip.bent{transform:skewX(-18deg) rotate(-8deg)}

/* ---------- 9. ضوّي الطرق ---------- */
.dest{cursor:pointer}
.dest text{font-weight:800}
.dest.lit circle{fill:color-mix(in srgb,var(--good) 30%,var(--panel));stroke:var(--good)}
.dest.nope{opacity:.35}

/* ---------- 10. المصعد ---------- */
.lift{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:stretch;max-width:520px;margin:6px auto}
.floors{display:grid;gap:6px}

<script>
(function(){
"use strict";
const DATA = /*DATA*/null;
const $=s=>document.querySelector(s);
const svgNS="http://www.w3.org/2000/svg";
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const DIFF={easy:"سهل",mid:"متوسط",hard:"صعب"};
const TNAME={meaning:"🤥 مين الصادق؟",match:"🔗 وصّل",memory:"🃏 الذاكرة",spell:"🔤 ركّب الاسم",true_false:"👉👈 صح ولا غلط",
  sequence:"🌉 ابنِ الجسر",fix_chain:"🚂 صلّح القطار",prereq:"🚪 افتح الباب",unlocks:"🗺️ ضوّي الطرق",sort:"🛗 المصعد",
  odd_one_out:"🧩 الدخيل",who_am_i:"🕵️ مين أنا؟",predict:"🔮 شو بيصير لو؟",adjust:"🎚️ اضبط"};
function shuffle(a,seed){a=a.slice();let s=seed||1;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickOne=(arr)=>arr[Math.floor(Math.random()*arr.length)];
let G=0,L=0,C=0,Qi=0; const done=new Set(); const evidence=[]; let tab="file"; let t0=performance.now();
const graph=()=>DATA.graphs[G]; const lesson=()=>graph().lessons[L]; const concept=()=>lesson().concepts[C];
const name=id=>graph().names[id]||id; const key=(c,i)=>G+":"+L+":"+c+":"+i;
const theme=()=>lesson().theme||"default"; const garden=()=>theme()==="garden";
let timers=[]; const later=(fn,ms)=>{const t=setTimeout(fn,reduce?Math.min(ms,30):ms);timers.push(t);return t;};
function clearTimers(){timers.forEach(clearTimeout);timers=[];}
let cleanups=[]; const onCleanup=f=>cleanups.push(f); function runCleanups(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];}

function record(cid,outcome){const q=concept().questions[Qi];evidence.push({concept_id:cid,lesson_id:lesson().lesson_id,activity:q.template,correctness:outcome,question_difficulty:q.difficulty,response_time_ms:Math.round(performance.now()-t0),modality:"interaction",interaction_yields_evidence:true,timestamp:new Date().toISOString()});t0=performance.now();if(tab==="ev")renderBelow();}

/* ---------- header + side ---------- */
const total=DATA.graphs.reduce((a,g)=>a+g.lessons.reduce((b,l)=>b+l.question_count,0),0);
const nl=DATA.graphs.reduce((a,g)=>a+g.lessons.length,0);
const nc=DATA.graphs.reduce((a,g)=>a+g.lessons.reduce((b,l)=>b+l.concepts.length,0),0);
$("#sub").textContent=`المصنع قرأ الكتاب بالستركشر الجديد، مرّ على ${nl} دروس، ولكل مفهوم (${nc} مفهوم) ولّد تحدياته: ${total} تحدي تفاعلي من 13 نوع، فحصهم وحفظهم مع الدرس.`;
let kid=true; const unlocked=new Set(); let openAll=false;   /* 🔓 demo switch: opens every lesson, station and challenge */
function lessonDone(gi,li){const l=DATA.graphs[gi].lessons[li];return l.concepts.every((c,ci)=>c.questions.every((_,qi)=>done.has(gi+":"+li+":"+ci+":"+qi)));}
function lessonLocked(gi,li){if(!kid||openAll)return false;const g=DATA.graphs[gi],l=g.lessons[li];if(unlocked.has(gi+":"+li))return false;
  return (l.requires||[]).some(rid=>{const ri=g.lessons.findIndex(x=>x.lesson_id===rid);return ri>=0&&!lessonDone(gi,ri);});}
const PLACE=["🏡","🌳","🌻","🪴","⛲","🏞️"];
function renderSide(){
  if(kid){$("#side").innerHTML=DATA.graphs.map((g,gi)=>`<h3>🗺️ ${g.title}</h3><div class="kmap">`+g.lessons.map((l,li)=>{const lock=lessonLocked(gi,li),dn=lessonDone(gi,li);
      const need=(l.requires||[]).map(rid=>(g.lessons.find(x=>x.lesson_id===rid)||{}).lesson_title).filter(Boolean);
      return `<div><button class="kplace${lock?" locked":""}${dn?" done":""}" data-g="${gi}" data-l="${li}" ${gi===G&&li===L?'aria-current="true"':""}><span class="ke">${alive(placeOf(gi,li))}</span><span><b dir="auto">${l.lesson_title}</b><small>${lock?"🔒 بينفتح بعد «"+need.join("» و«")+"»":l.concepts.length+" محطات"}</small></span><span class="klock">${lock?"🔒":""}</span></button>${lock?`<button class="unlockbtn" data-u="${gi}:${li}">🔓 افتحه هلأ</button>`:""}</div>`;}).join("")+`</div>`).join("");
    $("#side").querySelectorAll(".kplace").forEach(b=>b.addEventListener("click",()=>{const gi=+b.dataset.g,li=+b.dataset.l;if(lessonLocked(gi,li)){b.classList.add("shake");later(()=>b.classList.remove("shake"),450);return;}G=gi;L=li;C=0;Qi=0;renderAll();}));
    $("#side").querySelectorAll(".unlockbtn").forEach(b=>b.addEventListener("click",()=>{unlocked.add(b.dataset.u);const [gi,li]=b.dataset.u.split(":").map(Number);G=gi;L=li;C=0;Qi=0;renderAll();}));
    return;}
  $("#side").innerHTML=DATA.graphs.map((g,gi)=>{let last=null,unitShown=false;return `<h3>📘 ${g.title}</h3>`+g.lessons.map((l,li)=>{let head="";
    if(!unitShown&&l.unit_id){head+=`<div class="tree u">${g.names[l.unit_id]||l.unit_id}</div>`;unitShown=true;}
    if(l.topic_id&&l.topic_id!==last){head+=`<div class="tree t">${g.names[l.topic_id]||l.topic_id}</div>`;last=l.topic_id;}
    return head+`<button class="les" data-g="${gi}" data-l="${li}" ${gi===G&&li===L?'aria-current="true"':""}><span dir="auto">${l.lesson_title}</span><small>${l.concepts.length} مفاهيم</small></button>`;}).join("");}).join("");
  $("#side").querySelectorAll(".les").forEach(b=>b.addEventListener("click",()=>{G=+b.dataset.g;L=+b.dataset.l;C=0;Qi=0;renderAll();}));}

/* ---------- stars (note 3: no discouraging "0 of 1") ---------- */
const scores={};
const starStr=r=>{const n=r>=0.99?3:r>=0.5?2:1;return "★".repeat(n)+"☆".repeat(3-n);};
const starWord=r=>r>=0.99?"من أول مرة! 🤩":r>=0.5?"قرّبت كثير! 💪":"وصلت بالآخر، برافو! 💪";
function conceptDone(ci){return lesson().concepts[ci].questions.every((_,i)=>done.has(key(ci,i)));}
/* student mode: one step at a time — a station opens when the one before it is finished, a challenge when the one before it is done */
const stationOpen=ci=>!kid||openAll||ci===0||conceptDone(ci-1)||conceptDone(ci);
const challengeOpen=(ci,i)=>!kid||openAll||i===0||done.has(key(ci,i-1))||done.has(key(ci,i));

/* ---------- drag with mouse or finger; a tap (click) always works too ---------- */
function dragify(el,onDrop,opts){opts=opts||{};el.classList.add("drag");
  let edgeY=null,edgeLoop=0;
  const edgeScroll=()=>{edgeLoop=0;if(edgeY===null)return;const H=window.innerHeight,zone=70;let d=0;
    if(edgeY>H-zone)d=Math.ceil((edgeY-(H-zone))/5);else if(edgeY<zone)d=-Math.ceil((zone-edgeY)/5);
    if(d){window.scrollBy(0,d);edgeLoop=requestAnimationFrame(edgeScroll);}};
  el.addEventListener("pointerdown",e=>{if(el.disabled||el.classList.contains("used")||el.classList.contains("ok"))return;const sx=e.clientX,sy=e.clientY;let ghost=null,over=null,lx=sx,ly=sy,lt=performance.now(),vx=0,vy=0;
    const move=ev=>{const now=performance.now(),dt=Math.max(8,now-lt);vx=(ev.clientX-lx)/dt*16;vy=(ev.clientY-ly)/dt*16;lx=ev.clientX;ly=ev.clientY;lt=now;if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){ghost=el.cloneNode(true);ghost.classList.add("drag-ghost");ghost.classList.remove("lifted");ghost.style.width=el.getBoundingClientRect().width+"px";document.body.appendChild(ghost);
        if(opts.keep)ghost.style.opacity="0";else el.classList.add("lifted");   /* keep: you draw FROM it (a stem from a seed), you do not pick it up */
        if(opts.start)opts.start();}
      if(!ghost)return;ev.preventDefault();ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";if(opts.move)opts.move(ev);
      edgeY=ev.clientY;if(!edgeLoop)edgeLoop=requestAnimationFrame(edgeScroll);
      const t=(document.elementFromPoint(ev.clientX,ev.clientY)||{closest:()=>null}).closest("[data-drop]");if(over&&over!==t)over.classList.remove("over");if(t){t.classList.add("over");over=t;}else over=null;};
    const up=ev=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);edgeY=null;if(over)over.classList.remove("over");
      if(ghost){el.dataset.dragged="1";setTimeout(()=>delete el.dataset.dragged,60);const t=(document.elementFromPoint(ev.clientX,ev.clientY)||{closest:()=>null}).closest("[data-drop]");if(opts.end)opts.end();
        el.classList.remove("lifted");
        if(t){if(opts.keep)ghost.remove();else snap(ghost,t);onDrop(t);}else if(opts.fly!==false&&!reduce){fly(ghost,el,vx,vy);}else ghost.remove();}};
    window.addEventListener("pointermove",move,{passive:false});window.addEventListener("pointerup",up);});}
const tapped=el=>!el.dataset.dragged;
/* dropped on its place: it flies the last few pixels into it and settles (instead of vanishing) */
function snap(ghost,target){const r=target.getBoundingClientRect();ghost.style.transition="left .16s ease-out,top .16s ease-out,transform .16s ease-out,opacity .16s";
  ghost.style.left=(r.left+r.width/2)+"px";ghost.style.top=(r.top+r.height*0.6)+"px";ghost.style.transform="translate(-50%,-60%) scale(.85)";ghost.style.opacity=".2";setTimeout(()=>ghost.remove(),170);}
/* let go in the air: the card flies, tumbles and bounces around the page, then floats back home */
function fly(ghost,home,vx,vy){home.style.visibility="hidden";
  const kind=home.dataset.throw||(Math.random()<0.5?"ground":"space");
  return kind==="ground"?dropToGround(ghost,home,vx,vy):floatInSpace(ghost,home,vx,vy);}
/* light things: no gravity — they drift, spin slowly and bounce softly off the edges, like in space; catch them in the air */
function floatInSpace(ghost,home,vx,vy){sfx("whoosh");let x=parseFloat(ghost.style.left),y=parseFloat(ghost.style.top),rot=0,t=0,caught=false;
  const sp=Math.hypot(vx||0,vy||0);if(sp<3){const a=Math.random()*Math.PI*2;vx=Math.cos(a)*4;vy=Math.sin(a)*4;}
  const spin=(Math.random()<.5?-1:1)*(2+Math.random()*2);const W=window.innerWidth,H=window.innerHeight;
  ghost.style.transition="none";ghost.classList.add("floating");ghost.style.pointerEvents="auto";ghost.title="امسكني!";
  ghost.addEventListener("pointerdown",e=>{if(caught)return;caught=true;e.preventDefault();ghost.remove();home.style.visibility="";sfx("pop");
    home.dispatchEvent(new PointerEvent("pointerdown",{clientX:e.clientX,clientY:e.clientY,pointerId:e.pointerId,bubbles:true}));},{once:true});
  const step=()=>{if(caught||!ghost.isConnected)return;t++;vx*=0.996;vy*=0.996;x+=vx;y+=vy+Math.sin(t/25)*0.4;rot+=spin;
    if(x<40||x>W-40){vx=-vx;x=Math.max(40,Math.min(W-40,x));}if(y<40||y>H-40){vy=-vy;y=Math.max(40,Math.min(H-40,y));}
    ghost.style.left=x+"px";ghost.style.top=y+"px";ghost.style.transform=`translate(-50%,-60%) rotate(${rot}deg)`;
    if(t<330)requestAnimationFrame(step);else{ghost.classList.remove("floating");ghost.style.pointerEvents="none";goHome(ghost,home);}};
  step();}
function goHome(ghost,home,shadow){if(!ghost.isConnected){if(shadow)shadow.remove();return;}const r=home.getBoundingClientRect();ghost.style.transition="left .6s ease,top .6s ease,transform .6s ease";ghost.style.left=(r.left+r.width/2)+"px";ghost.style.top=(r.top+r.height*0.6)+"px";ghost.style.transform="translate(-50%,-60%) rotate(0deg)";
  if(shadow)shadow.remove();setTimeout(()=>{ghost.remove();home.style.visibility="";},620);}
/* heavy things: they fall to the ground with their shadow; pick them up again, or they go home by themselves after 10 seconds */
function dropToGround(ghost,home,vx){let x=parseFloat(ghost.style.left),y=parseFloat(ghost.style.top),vy=0,bounces=0;vx=(vx||0)*0.5;const H=window.innerHeight,W=window.innerWidth,floor=H-34;
  ghost.style.transition="none";const shadow=document.createElement("div");shadow.className="ground-shadow";document.body.appendChild(shadow);
  const step=()=>{if(!ghost.isConnected){shadow.remove();return;}vy+=0.9;x+=vx;y+=vy;if(x<30||x>W-30){vx=-vx;x=Math.max(30,Math.min(W-30,x));}
    if(y>=floor){y=floor;if(Math.abs(vy)>4&&bounces<2){vy=-vy*0.38;bounces++;sfx("thud");}else{vy=0;}}
    const h=Math.max(0,floor-y);shadow.style.left=x+"px";shadow.style.top=(floor+18)+"px";shadow.style.transform=`translate(-50%,0) scale(${Math.max(.4,1-h/300)})`;shadow.style.opacity=Math.max(.15,.55-h/600);
    ghost.style.left=x+"px";ghost.style.top=y+"px";ghost.style.transform="translate(-50%,-60%) rotate("+(vx*3)+"deg)";
    if(vy!==0||y<floor)requestAnimationFrame(step);else rest();};
  const rest=()=>{ghost.classList.add("resting");ghost.style.pointerEvents="auto";ghost.title="التقطني!";
    const home7=setTimeout(()=>{ghost.classList.remove("resting");ghost.style.pointerEvents="none";goHome(ghost,home,shadow);},10000);   /* 10 seconds on the ground */
    ghost.addEventListener("pointerdown",e=>{clearTimeout(home7);e.preventDefault();ghost.remove();shadow.remove();home.style.visibility="";sfx("pop");
      home.dispatchEvent(new PointerEvent("pointerdown",{clientX:e.clientX,clientY:e.clientY,pointerId:e.pointerId,bubbles:true}));},{once:true});};
  step();}

/* ===== 3. الذاكرة — a 3-second peek first; a wrong pair stays open until the student taps again ===== */
function qMemory(q){const cards=shuffle(q.pairs.flatMap(([id,m])=>[{k:id,txt:name(id),kind:"n"},{k:id,txt:m,kind:"m"}]),L*13+C*7+2);let open=[],stuck=false,found=0,moves=0,peeking=true;
  const icons=lesson().icons||{};
  $("#q").innerHTML=frame(q,`<p class="peek" id="peek">👀 احفظ الأماكن… <b id="pk">3</b></p><div class="mem">${cards.map((c,i)=>`<button class="mc open" data-i="${i}" aria-label="${c.txt}"><span class="side-a">${alive(garden()?"🌿":"❔")}</span><span class="side-b">${c.kind==="n"?`<span class="mi">${alive(icons[c.k]||"")}</span>`:""}${c.txt}</span></button>`).join("")}</div>`);
  const els=[...$("#q").querySelectorAll(".mc")];
  [2,1].forEach((n,i)=>later(()=>{const pk=$("#pk");if(pk)pk.textContent=n;},(i+1)*1000));
  later(()=>{els.forEach(e=>{e.classList.remove("open");e.setAttribute("aria-label","بطاقة مقلوبة");});peeking=false;const p=$("#peek");if(p)p.textContent="هلأ اقلب بطاقتين: المفهوم ومعناه 🃏";},3000);
  const closeStuck=()=>{open.forEach(x=>{x.classList.remove("open","oops");x.setAttribute("aria-label","بطاقة مقلوبة");});open=[];stuck=false;};
  els.forEach(el=>el.addEventListener("click",()=>{if(peeking)return;
    if(stuck){closeStuck();if(el.classList.contains("done"))return;}
    if(el.classList.contains("open")||el.classList.contains("done"))return;
    el.classList.add("open");sfx("flip");el.setAttribute("aria-label",cards[+el.dataset.i].txt);open.push(el);
    if(open.length<2)return;moves++;const [a,b]=open;const A=cards[+a.dataset.i],B=cards[+b.dataset.i];
    if(A.k===B.k&&A.kind!==B.kind){record(A.k,"correct");sfx("pop");a.classList.add("done");b.classList.add("done");open=[];fb("✨ لقيت زوج: «"+name(A.k)+"»","good");mascot("happy");
      if(++found===q.pairs.length){const r=moves<=q.pairs.length+1?1:moves<=q.pairs.length*2?0.6:0.3;later(()=>finish(q,r),400);}}
    else{record(A.k,"incorrect");stuck=true;a.classList.add("oops");b.classList.add("oops");mascot("oops","مش زوج! 🙈");fb("مش زوج… اقراهم على مهلك، واكبس على أي بطاقة لتكمّل.","bad");}}));}

/* ===== 4. ركّب الاسم ===== */
function qSpell(q){const chars=[...q.word];const letters=chars.map((ch,i)=>({ch,i})).filter(x=>!/\s/.test(x.ch));const order=shuffle(letters,L*17+C*5+9);
  const filled=chars.map(ch=>/\s/.test(ch)?ch:null);let wrong=0;
  $("#q").innerHTML=frame(q,`<div class="clue">💡 ${q.clue}</div><div class="slots">${chars.map((ch,i)=>/\s/.test(ch)?`<span class="lslot gap"></span>`:`<span class="lslot" data-s="${i}" data-drop="s${i}"></span>`).join("")}</div>
    <div class="tiles">${order.map((x,k)=>`<button class="tile" data-k="${k}" data-throw="ground">${x.ch}</button>`).join("")}</div><div id="wd"></div>`);
  const next=()=>filled.findIndex(v=>v===null);
  const put=(tile,slotIndex)=>{if(tile.classList.contains("used"))return;const k=+tile.dataset.k,x=order[k];const at=slotIndex==null?next():slotIndex;if(at<0)return;
    if(chars[at]===x.ch&&filled[at]===null){sfx("click");filled[at]=x.ch;tile.classList.add("used");const s=$("#q").querySelector(`.lslot[data-s="${at}"]`);s.textContent=x.ch;s.classList.add("filled");
      if(next()<0){record(q.target,wrong?"partial":"correct");$("#wd").innerHTML=`<div class="word-done">${q.word} ${garden()?"🌸":"✨"}</div>`;fb("🎉 ركّبت الاسم!","good");finish(q,wrong===0?1:wrong<=2?0.6:0.3);}}
    else{wrong++;tile.classList.add("spin");later(()=>tile.classList.remove("spin"),620);fb("الحرف هاد مش مكانه هون… جرّب غيره.","bad");if(wrong===1)mascot("oops");}};
  $("#q").querySelectorAll(".tile").forEach(t=>{t.addEventListener("click",()=>{if(tapped(t))put(t,null);});dragify(t,s=>{if(s.classList.contains("lslot"))put(t,+s.dataset.s);});});}

/* ===== 5. صح ولا غلط — the concept says the sentence; feed it to the hungry monster «صح» or «غلط» ===== */
const MONSTER=(col,mouthId)=>`<svg class="mon" viewBox="0 0 120 120" aria-hidden="true"><path d="M20 112 C6 60 24 18 60 18 C96 18 114 60 100 112Z" fill="${col}" ${OL}/>
 <path d="M30 26 L24 6 L44 20 M90 26 L96 6 L76 20" fill="${col}" ${OL}/>
 <g transform="translate(60 46) scale(1.25)"><g transform="translate(-10 -6)"><g class="seye"><ellipse rx="6.6" ry="7.6" fill="#fff" ${OL}/><g class="spupil"><circle r="3.5" fill="#2a1d12"/><circle cx="1.3" cy="-1.5" r="1.25" fill="#fff"/></g></g></g><g transform="translate(10 -6)"><g class="seye"><ellipse rx="6.6" ry="7.6" fill="#fff" ${OL}/><g class="spupil"><circle r="3.5" fill="#2a1d12"/><circle cx="1.3" cy="-1.5" r="1.25" fill="#fff"/></g></g></g></g>
 <g class="mouth" id="${mouthId}"><ellipse cx="60" cy="82" rx="30" ry="18" fill="#5a1f2a" ${OL}/><path d="M38 72 L44 80 L50 71 L56 80 L62 71 L68 80 L74 71 L80 79" fill="#fff" ${OL}/></g></svg>`;
function qTrueFalse(q){const cards=q.statements;let k=0,right=0,streak=0;const icons=lesson().icons||{};const stages=skin().grow.slice(0,4);
  $("#q").innerHTML=frame(q,`<div class="tfstage" style="margin-top:34px">
      <button class="monster yes" id="myes" data-drop="yes" aria-label="صح">${MONSTER("#7DD08A","mouthY")}<b>صح ✅</b></button>
      <div class="tfmid"><div class="tfspeaker" id="spk">${charHTML(q.target,icons[q.target],"happy")}</div><div class="tfcard2" id="tfc" dir="auto"></div><div class="tfplant"><span id="tfp">${alive(stages[0])}</span><small id="tfn"></small></div></div>
      <button class="monster no" id="mno" data-drop="no" aria-label="غلط">${MONSTER("#B9A2F0","mouthN")}<b>غلط ❌</b></button></div>`);

  const eat=(mon,ok)=>{const m=mon.querySelector(".mouth");mon.classList.remove("chew","spit");void mon.offsetWidth;mon.classList.add(ok?"chew":"spit");
    if(ok){sfx("chew");later(()=>sfx("burp"),500);}else sfx("spit");};
  const answer=sayTrue=>{if(busy)return;busy=true;const c=cards[k];const ok=sayTrue===c.answer;const mon=sayTrue?$("#myes"):$("#mno");record(q.target,ok?"correct":"incorrect");
    const card=$("#tfc");card.classList.add(sayTrue?"toYes":"toNo");

    else{streak=Math.max(0,streak-1);eat(mon,false);fb("🤢 بلّاه! هاي الجملة "+(c.answer?"صح ✅":"غلط ❌"),"bad");later(()=>{card.classList.remove("toYes","toNo");card.classList.add(c.answer?"toYes":"toNo");eat(c.answer?$("#myes"):$("#mno"),true);},800);}
    const spk=$("#spk .char");if(!c.answer){later(()=>{spk.classList.add("liar");spk.dataset.mood="laugh";fb("🤥 كذبة! "+($("#fb").textContent||""),ok?"good":"bad");},350);}else{spk.dataset.mood="laugh";}
    later(()=>{grow();},500);
    later(()=>{card.classList.remove("toYes","toNo");busy=false;k++;if(k<cards.length)show();else finish(q,right/cards.length);},ok?1300:1900);};
  let busy=false;
  $("#myes").addEventListener("click",()=>answer(true));$("#mno").addEventListener("click",()=>answer(false));
  dragify($("#tfc"),t=>{if(t.id==="myes")answer(true);else if(t.id==="mno")answer(false);},{fly:false});
  show();}


/* ===== 6. ابنِ الجسر — like bridge-building games: a car with the seed drives over; weak parts turn red, crack and fall ===== */
function qSequence(q){const n=q.order.length,items=shuffle(q.order,L*3+C*7+2);const filled=Array(n).fill(null);let tries=0,busy=false;const W=120*n+80,gz=garden();const icons=lesson().icons||{};
  const DECK=62;
  $("#q").innerHTML=frame(q,`<div class="chips" id="pool" style="margin-top:34px">${items.map(id=>`<button class="chip${id===q.target?" star":""}" data-id="${id}" data-throw="ground" dir="auto">${alive(icons[id]||"")} ${name(id)}</button>`).join("")}</div>
   <svg class="stage" id="br" viewBox="0 0 ${W} 170" role="img" aria-label="جسر من ${n} قطع فوق المي">
     <rect x="0" y="100" width="${W}" height="70" fill="var(--water)" opacity=".35"/>
     <path d="M0 112 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="var(--water)" stroke-width="2" fill="none" opacity=".7"/>
     <rect x="${W-40}" y="${DECK}" width="40" height="108" fill="#7A4D2B"/><rect x="0" y="${DECK}" width="40" height="108" fill="#7A4D2B"/>
     <text x="${W-20}" y="${DECK+52}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">البداية</text><text x="20" y="${DECK+54}" text-anchor="middle" font-size="16">🏁</text>
     <g id="deck">${q.order.map((_,i)=>{const x=W-40-(i+1)*120+10;return `<g class="plank" data-i="${i}" data-drop="p${i}" style="transition:transform .9s ease-in;transform-box:fill-box;transform-origin:center">
        <rect class="pillar" x="${x+40}" y="${DECK+26}" width="20" height="60" fill="#9B6B43" stroke="#5E3A1F" stroke-width="2"/>
        <rect class="slab" x="${x}" y="${DECK}" width="100" height="26" rx="${gz?13:5}" fill="var(--chip)" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4"/>
        <path class="crack" d="M${x+30} ${DECK+2} l8 9 l-6 6 l9 8 M${x+66} ${DECK+3} l-6 8 l7 6" stroke="#5a1f1f" stroke-width="2" fill="none" opacity="0"/>
        <text x="${x+50}" y="${DECK+18}" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">${i+1}</text></g>`;}).join("")}</g>
     <g id="fx"></g>
     <g id="car"><g id="carbody"><rect x="-26" y="-22" width="52" height="20" rx="7" fill="#E8574A" stroke="#3b2a1a" stroke-width="2.4"/><circle cx="-14" cy="0" r="7" fill="#3b2a1a"/><circle cx="14" cy="0" r="7" fill="#3b2a1a"/>
       <g id="driver" data-mood="happy"><g class="ch" transform="translate(-17 -54) scale(.34)">${ARTS[skin().driver]?ARTS[skin().driver]():ARTS.seed()}</g></g><g id="sweat" opacity="0"><path d="M10 -50 C10 -50 4 -42 4 -38 C4 -34 7 -32 10 -32 C13 -32 16 -34 16 -38 C16 -42 10 -50 10 -50Z" fill="#7CC6F2" stroke="#3b2a1a" stroke-width="1.6"/></g></g></g>
   </svg>
   <div class="row"><button class="btn" id="chk" disabled>🚗 يلا!</button><button class="btn ghost" id="clr">فضّي</button></div>`);
  const ON=DECK-7;   /* the wheels stand ON the road (wheel radius 7), not inside it */
  const planks=[...$("#q").querySelectorAll(".plank")],car=$("#car"),fx=$("#fx"),driver=$("#driver");let cx=W-20,cy=ON,rot=0;
  const place=()=>car.setAttribute("transform",`translate(${cx} ${cy}) rotate(${rot})`);place();
  const setDriver=m=>{driver.setAttribute("data-mood",m);};
  const neutral=()=>planks.forEach((g,i)=>{const r=g.querySelector(".slab"),t=g.querySelector("text");const v=filled[i];t.textContent=v?name(v):i+1;r.setAttribute("stroke-dasharray",v?"0":"5 4");
      r.setAttribute("fill",v?(gz?"color-mix(in srgb, var(--leaf) 30%, var(--panel))":"color-mix(in srgb, var(--brand) 18%, var(--panel))"):"var(--chip)");r.setAttribute("stroke",v?"var(--brand)":"var(--line)");g.querySelector(".crack").setAttribute("opacity","0");});
  const paint=()=>{neutral();$("#q").querySelectorAll("#pool .chip").forEach(c=>c.classList.toggle("used",filled.includes(c.dataset.id)));$("#chk").disabled=filled.includes(null)||busy;};
  $("#q").querySelectorAll("#pool .chip").forEach(c=>{c.addEventListener("click",()=>{if(!tapped(c)||busy)return;const i=filled.indexOf(null);if(i>=0){filled[i]=c.dataset.id;paint();}});
    dragify(c,t=>{if(busy||!t.classList.contains("plank"))return;const i=+t.dataset.i;const at=filled.indexOf(c.dataset.id);if(at>=0)filled[at]=null;filled[i]=c.dataset.id;paint();});});
  planks.forEach((g,i)=>g.addEventListener("click",()=>{if(!busy){filled[i]=null;paint();}}));
  $("#clr").addEventListener("click",()=>{if(!busy){filled.fill(null);paint();}});
  const circle=(x,y,r,attrs)=>{const c=document.createElementNS(svgNS,"circle");c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r);Object.entries(attrs).forEach(([k2,v])=>c.setAttribute(k2,v));fx.appendChild(c);return c;};
  function splash(x){sfx("splash");later(()=>sfx("bubbles"),350);mascot("dive");[0,1].forEach(k2=>later(()=>{const r=circle(x,104,4,{fill:"none",stroke:"var(--water)","stroke-width":"2"});let rr=4;const grow=()=>{rr+=1.1;r.setAttribute("r",rr);r.setAttribute("opacity",Math.max(0,1-rr/30));if(rr<30)requestAnimationFrame(grow);else r.remove();};grow();},k2*180));
    for(let k2=0;k2<7;k2++)later(()=>{const b=circle(x+(Math.random()*16-8),132,2+Math.random()*3,{fill:"none",stroke:"#fff","stroke-width":"1.5",opacity:".9"});let yy=132;const up=()=>{yy-=0.8;b.setAttribute("cy",yy);b.setAttribute("opacity",Math.max(0,(yy-100)/32));if(yy>100)requestAnimationFrame(up);else b.remove();};up();},300+k2*220);}
  const SPEED=reduce?60:1.5;
  function drive(firstBad,done){const centre=i=>W-40-(i+1)*120+60;   /* middle of a part */
    const goal=firstBad<0?20:centre(firstBad);const badX=firstBad<0?-1e9:W-40-firstBad*120;let scared=false,onIt=false;
    const step=()=>{if(!car.isConnected)return;   /* the student moved on: stop quietly */
      if(cx>goal){const slow=onIt?0.45:1;cx=Math.max(goal,cx-SPEED*slow);rot=Math.sin(cx/9)*1.2;
        if(firstBad>=0&&!onIt&&cx<badX-2){onIt=true;const g=planks[firstBad];g.classList.add("wobble");sfx("creakup");}   /* now on the weak part: it wobbles under the car */
        if(onIt){cy=ON+Math.sin(cx/3)*1.2;}place();
        const passed=Math.floor((W-40-cx)/120);planks.forEach((g,i)=>{if(i<passed&&i!==firstBad&&filled[i]===q.order[i]){const r=g.querySelector(".slab");r.setAttribute("fill","color-mix(in srgb, var(--good) 35%, var(--panel))");r.setAttribute("stroke","var(--good)");}});
        if(firstBad>=0&&!scared&&cx-badX<80){scared=true;setDriver("o");$("#sweat").setAttribute("opacity","1");{const cb=$("#carbody");if(cb)cb.classList.add("shiver");}fb("😨 «"+skin().name+"»: أوه لا! هاد مش ثابت!","bad");
          const s=planks[firstBad].querySelector(".slab");s.setAttribute("fill","#F6D365");sfx("creakup");}
        requestAnimationFrame(step);return;}
      if(firstBad<0){setDriver("laugh");done();return;}
      const g=planks[firstBad];const s=g.querySelector(".slab");s.setAttribute("fill","#E8574A");s.setAttribute("stroke","#8a1f1f");g.querySelector(".crack").setAttribute("opacity","1");sfx("crack");
      later(()=>{g.classList.remove("wobble");g.style.transform="translateY(80px) rotate(26deg)";let t=0,vy=0;   /* the part breaks and falls; the car falls WITH it, from the middle of the part into the water */
        const fall=()=>{if(!car.isConnected)return;t++;vy+=0.35;cy+=vy;rot+=2.4;place();if(cy<160&&!reduce)requestAnimationFrame(fall);else{car.setAttribute("opacity","0");{const cb=$("#carbody");if(cb)cb.classList.remove("shiver");}$("#sweat").setAttribute("opacity","0");
            splash(cx);later(()=>{const head=document.createElementNS(svgNS,"g");head.setAttribute("data-mood","o");head.innerHTML=`<g class="ch" transform="translate(${cx-17} 84) scale(.34)">${ARTS[skin().driver]?ARTS[skin().driver]():ARTS.seed()}</g>`;fx.appendChild(head);
              const bub=document.createElementNS(svgNS,"text");bub.setAttribute("x",cx);bub.setAttribute("y",80);bub.setAttribute("text-anchor","middle");bub.setAttribute("font-size","14");bub.setAttribute("font-weight","700");bub.setAttribute("fill","currentColor");bub.textContent="أتشو! 🤧";fx.appendChild(bub);sfx("sneeze");
              later(()=>{head.remove();bub.remove();done();},1500);},900);}};
        fall();},600);};
    step();}
  $("#chk").addEventListener("click",()=>{busy=true;tries++;paint();const nOk=filled.filter((x,i)=>x===q.order[i]).length;const firstBad=filled.findIndex((x,i)=>x!==q.order[i]);
    record(q.target,nOk===n?"correct":nOk>0?"partial":"incorrect");sfx("chug");car.setAttribute("opacity","1");cx=W-20;cy=ON;rot=0;setDriver("happy");place();
    drive(firstBad,()=>{busy=false;
      if(firstBad<0){fb("🏁 «"+skin().name+"» قطع الجسر! كل القطع ثابتة","good");finish(q,tries===1?1:tries===2?0.6:0.3);}
      else{planks[firstBad].style.transform="";filled[firstBad]=null;car.setAttribute("opacity","1");cx=W-20;cy=ON;rot=0;setDriver("happy");place();
        fb("💦 القطعة رقم "+(firstBad+1)+" ما تحمّلت. حط القطعة الصح مكانها وجرّب.","bad");paint();}});});}

/* ===== 7. صلّح القطار — numbered wagons, arrows, first/last, and the story of the chain ===== */
function qFixChain(q){const shown=q.chain.slice();shown[q.wrong_index]=q.wrong;let step=1,mistakes=0;const icons=lesson().icons||{};
  const first=name(q.chain[0]),last=name(q.chain[q.chain.length-1]);
  $("#q").innerHTML=frame(q,`<p class="story">🚂 قطار من «${first}» لـ «${last}»: <b>كل عربة بتيجي بعد اللي قدامها</b>.</p>
    <div class="train" id="train"><div class="wagon engine">${alive("🚂")}<small>البداية</small></div>${shown.map((id,i)=>`<span class="tarrow">←</span><button class="wagon" data-i="${i}" data-drop="w${i}" dir="auto"><span class="wn">${i+1}</span>${i===0?'<span class="wtag">الأول</span>':""}${i===shown.length-1?'<span class="wtag">الآخر</span>':""}<span class="wi">${alive(icons[id]||"")}</span><span class="wt">${name(id)}</span></button>`).join("")}</div>
    <p class="small" id="tstep">الخطوة ١: اكبس على العربة اللي <b>مش بمكانها</b>.</p><div class="chips" id="opts" style="display:none">${q.options.map(id=>`<button class="chip" data-id="${id}" dir="auto">${alive(icons[id]||"")} ${name(id)}</button>`).join("")}</div>`);
  const wagons=[...$("#q").querySelectorAll(".wagon[data-i]")];
  const say=(w,t)=>{const s=document.createElement("span");s.className="say";s.textContent=t;w.appendChild(s);later(()=>s.remove(),1300);};
  wagons.forEach(w=>w.addEventListener("click",()=>{if(step!==1)return;const i=+w.dataset.i;
    if(i===q.wrong_index){record(q.target,"correct");step=2;w.classList.add("picked","busted");say(w,"اكتشفتني!");sfx("honk");
      const drop=document.createElement("span");drop.className="sweatdrop";w.appendChild(drop);
      later(()=>{w.classList.add("jumpoff");sfx("whoosh");},500);
      later(()=>{w.classList.remove("busted","jumpoff");drop.remove();w.querySelector(".wt").textContent="؟";w.querySelector(".wi").textContent="";w.classList.add("gap");w.classList.remove("picked");$("#opts").style.display="";$("#tstep").innerHTML="الخطوة ٢: حط العربة الصح <b>مكان الفراغ</b> (اسحبها أو اكبس عليها).";},1300);fb("✓ لقيت العربة الدخيلة!","good");}
    else{mistakes++;record(q.target,"incorrect");sfx("honk");w.classList.add("honk");say(w,"مش أنا! 😤 توت توت");later(()=>w.classList.remove("honk"),420);fb("هاي العربة بمكانها الصح: «"+name(shown[i])+"» فعلاً بتيجي هون.","bad");mascot("oops");}}));
  const fix=chip=>{if(step!==2||chip.disabled)return;const id=chip.dataset.id;const gap=wagons[q.wrong_index];
    if(id===q.chain[q.wrong_index]){step=3;record(q.target,"correct");gap.querySelector(".wt").textContent=name(id);gap.querySelector(".wi").innerHTML=alive(icons[id]||"");gap.classList.remove("gap");gap.classList.add("fixed");chip.classList.add("ok");
      fb("🚂 توووت! القطار ماشي على السكة الصح","good");sfx("whistle");later(()=>sfx("chug"),400);mascot("happy","توووت! 🚂");later(()=>$("#train").classList.add("go"),600);later(()=>finish(q,mistakes===0?1:mistakes===1?0.6:0.3),1800);}
    else{mistakes++;record(q.target,"incorrect");chip.classList.add("no","shake");chip.disabled=true;say(gap,"ما بتركب! 💥");fb("هاي العربة ما بتركب هون.","bad");}};
  $("#q").querySelectorAll("#opts .chip").forEach(c=>{c.addEventListener("click",()=>{if(tapped(c))fix(c);});dragify(c,t=>{if(t.classList.contains("wagon"))fix(c);});});}

/* ===== 8. افتح الباب — a door with a face; behind it, the concept itself ===== */
function qPrereq(q){const n=q.correct.length;let opened=0,wrong=0,solved=false;
  $("#q").innerHTML=frame(q,`<div class="doorbox" id="dbox" style="margin-top:40px">
      <div class="behind"><span class="who">${alive((lesson().icons||{})[q.target]||"😄")} ${name(q.target)} <span class="wave2">👋</span></span><div class="friends" id="friends"></div><div class="line" id="dline"></div></div>
      <div class="door" id="door" data-drop="door"><span class="dface">${`<span class="eye l"><span class="pupil"></span></span><span class="eye r"><span class="pupil"></span></span><span class="mouth"></span>`}</span>
        <span class="dname">${name(q.target)}</span><span class="locks">${q.correct.map((_,i)=>`<span class="lk" data-i="${i}">🔒</span>`).join("")}</span></div></div>
    <div class="chips keys">${q.options.map(id=>`<button class="chip" data-id="${id}" data-throw="ground" dir="auto">${name(id)}</button>`).join("")}</div>`);
  const door=$("#door");const follow=ev=>lookAt(door,ev.clientX,ev.clientY);window.addEventListener("pointermove",follow);onCleanup(()=>window.removeEventListener("pointermove",follow));
  const useKey=c=>{if(solved||c.classList.contains("ok")||c.disabled)return;const id=c.dataset.id;
    if(q.correct.includes(id)){c.classList.add("ok");sfx("click");const lk=$("#q").querySelector(`.lk[data-i="${opened}"]`);lk.textContent="🔓";lk.classList.add("drop");opened++;
      door.classList.add("smile");later(()=>door.classList.remove("smile"),900);
      fb(opened<n?"🔓 كلِك! الباب: «آآخ… قفل كمان وبرتاح 😌»":"🔓 كلِك!","good");
      if(opened===n){solved=true;record(q.target,wrong?"partial":"correct");
        door.classList.add("joy");sfx("laugh");
        later(()=>{door.classList.remove("joy");$("#dbox").classList.add("open");sfx("creak");mascot("happy","انفتح! 🚪");},1100);
        q.correct.forEach((k2,i)=>later(()=>{const s=document.createElement("span");s.innerHTML=alive((lesson().icons||{})[k2]||"🙂")+" "+name(k2);$("#friends").appendChild(s);sfx("pop");},1900+i*300));
        later(()=>{$("#dline").textContent=`صح! بدون ${q.correct.map(name).join(" و")} ما بقدر أكمّل 🤝`;},1900+n*300);
        later(()=>finish(q,n/(n+wrong)),2500+n*300);}}
    else{wrong++;record(q.target,"incorrect");sfx("laugh");door.classList.add("giggle");c.classList.add("no","bent");c.disabled=true;later(()=>door.classList.remove("giggle"),1100);
      fb("🤭 الباب: «هههه بيزغزغ!» وبصق المفتاح أعوج: «"+name(id)+"» مش لازم قبل «"+name(q.target)+"».","bad");mascot("oops");}};
  $("#q").querySelectorAll(".keys .chip").forEach(c=>{c.addEventListener("click",()=>{if(tapped(c))useKey(c);});dragify(c,t=>{if(t.dataset.drop==="door")useKey(c);});});}

/* ===== 9. رحلة على الخريطة — crossroads one by one; Thaloub the fox tricks, the owl gives hints (not answers) ===== */
function qUnlocks(q){const icons=lesson().icons||{};let step=0,wrong=0,hintsUsed=0,owl=-1,busy=false;
  $("#q").innerHTML=frame(q,`<div class="trail" id="trail" style="margin-top:36px"></div>
    <div class="cross" id="cross"></div>
    <div class="helpers"><button class="btn ghost" id="owl">🦉 بومة، ساعديني (-⭐)</button><span class="owlsay" id="owlsay"></span></div>`);
  const trail=()=>{$("#trail").innerHTML=q.route.slice(0,step+1).map((id,i)=>`${i?'<span class="tline lit"></span>':""}<span class="tnode${i===step?" here":""}">${alive(icons[id]||"📍")} ${name(id)}${i===step?' <span class="walker">🚶</span>':""}</span>`).join("")
    +(step<q.route.length-1?'<span class="tline"></span><span class="tnode fog">❔</span>':' <span class="tnode end">🏁</span>');};
  const showCross=()=>{owl=-1;$("#owlsay").textContent="";const opts=shuffle(q.junctions[step],L*7+C*3+step);const wrongIdx=opts.map((o,i)=>o===q.route[step+1]?-1:i).filter(i=>i>=0);const fox=wrongIdx[Math.floor(Math.random()*wrongIdx.length)];
    const FOXLINES=["من هون أقصر! 😏","هاد الطريق فيه ظل ومي 🌳","ثق فيي، أنا بعرف المنطقة 🦊","بالآخر في هدية 🎁"];const foxSay=FOXLINES[Math.floor(Math.random()*FOXLINES.length)];
    $("#cross").innerHTML=`<p class="askq">📍 إنت عند ${alive(icons[q.route[step]]||"📍")} «<b>${name(q.route[step])}</b>». <b>مين بيحتاج «${name(q.route[step])}»؟</b></p><div class="roads">${opts.map((id,i)=>`<button class="road" data-id="${id}" data-drop="r${i}" dir="auto"><span class="rsign">${alive("🪧")}</span><span>${alive(icons[id]||"")} ${name(id)}</span>${i===fox?`<span class="fox">${alive("🦊")} <i>${foxSay}</i></span>`:""}</button>`).join("")}</div>`;
    $("#cross").querySelectorAll(".road").forEach(r=>r.addEventListener("click",()=>go(r)));};
  const go=r=>{if(busy||r.classList.contains("broken"))return;const id=r.dataset.id;const right=id===q.route[step+1];const foxHere=!!r.querySelector(".fox");
    record(q.route[step],right?"correct":"incorrect");
    if(right){busy=true;r.classList.add("lit");sfx("step");const why=document.createElement("p");why.className="why";why.textContent="💡 "+(q.whys?q.whys[step]:"");$("#cross").appendChild(why);if(foxHere)r.querySelector(".fox i").textContent="آخخ! صح 😤";else{const f=$("#cross .fox i");if(f)f.textContent="ما صدّقتني! 😤";}
      fb("✨ «"+name(id)+"» بيحتاج «"+name(q.route[step])+"»: الطريق ضوّى!","good");mascot("happy");
      later(()=>{step++;busy=false;trail();if(step>=q.route.length-1){$("#cross").innerHTML=`<p class="arrive">🏁 وصلت! ${q.route.map(x=>alive(icons[x]||"")+" "+name(x)).join(" ← ")}</p><p class="small">${alive("🦉")} البومة بتصفّق 👏 · ${alive("🦊")} ثعلوب هرب زعلان 💨</p>`;$("#owl").disabled=true;
          finish(q,Math.max(0.3,1-wrong*0.25-hintsUsed*0.2));}else showCross();},2200);}
    else{wrong++;sfx("crumble");later(()=>sfx("laugh"),300);r.classList.add("broken");r.querySelector("span:last-child")||0;const s=document.createElement("span");s.className="crumble";s.textContent="💥 الطريق انهار!";r.appendChild(s);
      const f=$("#cross .fox i");if(f)f.textContent=foxHere?"هههه صدّقتني! 🦊":"هههه! 🦊";
      fb("«"+name(id)+"» مش بعد «"+name(q.route[step])+"» مباشرة. جرّب طريق ثاني.","bad");mascot("oops");}};
  $("#owl").addEventListener("click",()=>{if(owl>=2)return;owl++;hintsUsed++;sfx("hoot");$("#owlsay").textContent="🦉 "+q.hints[step][owl];});
  trail();showCross();}

/* ===== 10. المصعد — free placement, then «ثبّت 🔒»: the elevator tours the floors; the cat pushes wrong ones out ===== */
function qSort(q){const items=shuffle(q.before.concat(q.after),L*5+C*3+1);const isBefore=new Set(q.before);const icons=lesson().icons||{};let confirms=0,busy=false;
  const where={};   /* concept -> floor index */
  const above=q.after.map((_,i)=>({side:"after",i})).reverse(),below=q.before.map((_,i)=>({side:"before",i}));const floors=[...above,{side:"me"},...below];const mid=above.length;
  $("#q").innerHTML=frame(q,`<ol class="steps"><li>اسحب كل مفهوم لطابق (أو اكبس عليه وبعدين على الطابق).</li><li>لما تخلص، اكبس <b>«ثبّت 🔒»</b> والمصعد بيعمل جولة.</li></ol>
    <div class="building" id="bld">${floors.map((f,k)=>f.side==="me"?`<div class="frow"><div class="floor me" data-k="${k}">🏠 أنا هون: <b>${alive(icons[q.target]||"")} ${name(q.target)}</b></div><div class="shaft"></div></div>`:`<div class="frow"><div class="floor" data-k="${k}" data-side="${f.side}" data-drop="f${k}"><span class="fl">${f.side==="after"?"⬆️ بعد":"⬇️ قبل"} «${name(q.target)}»</span><span class="who"></span></div><div class="shaft"></div></div>`).join("")}
      <div class="car" id="car"><span class="doors"><i></i><i></i></span><span class="rider" id="rider">🛗</span></div></div>
    <div class="chips lobby" id="pool">${items.map(id=>`<button class="chip" data-id="${id}" dir="auto">${alive(icons[id]||"")} ${name(id)}</button>`).join("")}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="lock" disabled>ثبّت 🔒</button></div>`);
  const bld=$("#bld"),car=$("#car"),fls=[...bld.querySelectorAll(".floor")];let sel=null;
  const moveTo=k=>{const row=fls[k].parentElement;car.style.top=(row.offsetTop+(row.offsetHeight-car.offsetHeight)/2)+"px";};   /* measured inside the building: fixes the "goes below the screen" bug */
  later(()=>moveTo(mid),40);window.onresize=()=>moveTo(mid);
  const chipOf=id=>$("#q").querySelector(`#pool .chip[data-id="${id}"]`);
  const render=()=>{fls.forEach((f,k)=>{if(f.classList.contains("me"))return;const id=Object.keys(where).find(x=>where[x]===k);const w=f.querySelector(".who");w.innerHTML=id?`<button class="placed" data-id="${id}" dir="auto">${alive(icons[id]||"")} ${name(id)} <span class="wave">👋</span></button>`:"";f.classList.toggle("taken",!!id);});
    items.forEach(id=>chipOf(id).classList.toggle("used",id in where));$("#lock").disabled=busy||Object.keys(where).length<items.length;
    fls.forEach(f=>f.querySelectorAll(".placed").forEach(p=>p.addEventListener("click",()=>{if(busy)return;delete where[p.dataset.id];render();fb("رجّعت «"+name(p.dataset.id)+"» للأرض.","");})));};
  const placeIn=(id,k)=>{if(busy||fls[k].classList.contains("me"))return;sfx("pop");const prev=Object.keys(where).find(x=>where[x]===k);if(prev)delete where[prev];where[id]=k;sel=null;
    $("#q").querySelectorAll("#pool .chip").forEach(c=>c.setAttribute("aria-pressed","false"));render();const f=fls[k];f.classList.add("pulse");later(()=>f.classList.remove("pulse"),600);fb("👋 «"+name(id)+"» قعد بطابقه.","");};
  $("#q").querySelectorAll("#pool .chip").forEach(c=>{c.addEventListener("click",()=>{if(!tapped(c)||busy)return;$("#q").querySelectorAll("#pool .chip").forEach(x=>x.setAttribute("aria-pressed","false"));c.setAttribute("aria-pressed","true");sel=c.dataset.id;fb("هلأ اكبس على طابق 🛗","");});
    dragify(c,t=>{if(t.classList.contains("floor"))placeIn(c.dataset.id,+t.dataset.k);});});
  fls.forEach((f,k)=>f.addEventListener("click",e=>{if(e.target.closest(".placed"))return;if(sel)placeIn(sel,k);}));
  $("#lock").addEventListener("click",()=>{busy=true;confirms++;render();const order=fls.map((f,k)=>k).filter(k=>k!==mid);let wrongIds=[];let i=0;
    const visit=()=>{if(i>=order.length){car.classList.remove("opened");moveTo(mid);$("#rider").textContent="🛗";
        if(!wrongIds.length){const rows=[...bld.querySelectorAll(".frow")].reverse();rows.forEach((r,j)=>later(()=>r.firstElementChild.classList.add("glow"),j*240));
          later(()=>{fb("✨ كله صح! من تحت (قبل) لفوق (بعد)","good");finish(q,confirms===1?1:confirms===2?0.6:0.3);},rows.length*240+300);}
        else{busy=false;render();fb("القطة رجّعت "+wrongIds.length+" للأرض 🐱 صلّحهم واكبس «ثبّت» ثاني.","bad");}return;}
      const k=order[i++];const id=Object.keys(where).find(x=>where[x]===k);moveTo(k);sfx("click");
      later(()=>{car.classList.add("opened");const ok=(fls[k].dataset.side==="before")===isBefore.has(id);record(id,ok?"correct":"incorrect");$("#rider").innerHTML=alive(icons[id]||"")+" "+name(id);
        if(ok){fls[k].classList.add("right");sfx("ding");fb("🛎️ دينغ! «"+name(id)+"» صح بطابقه","good");later(()=>{car.classList.remove("opened");visit();},700);}
        else{const cat=document.createElement("div");cat.className="catpop";cat.innerHTML=`<span class="cat2"><span class="ear l"></span><span class="ear r"></span><span class="cface"><span class="eye l"><span class="pupil"></span></span><span class="eye r"><span class="pupil"></span></span><span class="cnose"></span><span class="whisk l"></span><span class="whisk r"></span><span class="cmouth"></span></span><span class="ctail"></span></span><span class="cat-say">ميااااو! لا لا! مش هون! 😾</span><span class="paw">🐾</span>`;fls[k].appendChild(cat);sfx("meow");later(()=>sfx("hiss"),500);mascot("oops");
          later(()=>{const who=fls[k].querySelector(".placed");if(who)who.classList.add("kicked");},650);
          later(()=>{cat.classList.add("slam");},1100);
          later(()=>{cat.remove();wrongIds.push(id);delete where[id];fls[k].classList.remove("right");render();car.classList.remove("opened");visit();},1500);}},1050);};
    fls.forEach(f=>f.classList.remove("right","glow"));visit();});
  render();}

/* ===== 11. الدخيل — garden pot: everyone is sad, each one introduces itself; pull the weed out ===== */
function qOdd(q){const all=shuffle(q.family.concat([q.intruder]),L*21+C*3+4);let wrong=0,solved=false;const gz=garden();const icons=lesson().icons||{};
  $("#q").innerHTML=frame(q,`<div class="pot ${gz?"garden":"photo"}" id="pot" style="margin-top:36px">
      <div class="potrow">${all.map(id=>`<button class="buddy" data-id="${id}" dir="auto"><span class="bsay"></span>${charHTML(id,icons[id],"sad")}<span class="bname">${name(id)}</span></button>`).join("")}</div>
      <div class="potbase">${gz?"🪴 حوض العيلة":"📸 صورة العيلة"}</div></div>
    <p class="small">مرّر على أي واحد (أو اكبس عليه مطوّل) ليعرّف عن حاله. وبعدين <b>اكبس على الدخيل</b> لتشدّه لبرا.</p>`);
  const buddies=[...$("#q").querySelectorAll(".buddy")];
  const follow=ev=>lookAt($("#pot")||document.body,ev.clientX,ev.clientY);window.addEventListener("pointermove",follow);onCleanup(()=>window.removeEventListener("pointermove",follow));
  const intro=b=>{if(solved)return;const id=b.dataset.id;buddies.forEach(x=>{x.querySelector(".bsay").textContent="";x.classList.add("nervous");later(()=>x.classList.remove("nervous"),500);});
    b.querySelector(".bsay").textContent="أنا «"+name(id)+"»: "+(q.intros[id]||"");};
  buddies.forEach(b=>{b.addEventListener("pointerenter",()=>intro(b));b.addEventListener("focus",()=>intro(b));
    b.addEventListener("click",()=>{if(solved||b.classList.contains("hold"))return;const id=b.dataset.id;
      if(id===q.intruder){solved=true;sfx("whoosh");record(q.target,wrong?"partial":"correct");setMood(b,"o");b.querySelector(".bsay").textContent="آآآ اكتشفتوني! 😱";b.classList.add("pulled");
        const moves=["laugh","jump","dance","clap"];
        buddies.filter(x=>x!==b).forEach((x,i)=>later(()=>{setMood(x,"happy");x.classList.add(moves[i%moves.length]);x.querySelector(".bsay").textContent=["هههه! 😂","يييي! 🤩","يلا نرقص! 💃","👏👏 🥳"][i%4];},500+i*150));
        fb("🌿 شدّيت الدخيل! والعيلة فرحت 🎉","good");mascot("happy");later(()=>finish(q,1/(1+wrong)),2200);}
      else{wrong++;record(q.target,"incorrect");b.classList.add("hold");b.querySelector(".bsay").textContent="لا! أنا من العيلة! 😤";setMood(b,"angry");later(()=>{if(!solved)setMood(b,"sad");},1200);later(()=>b.classList.remove("hold"),1200);
        fb("«"+name(id)+"» من عيلة الدرس فعلاً.","bad");mascot("oops");}});});}

/* ===== 12. مين أنا؟ — the masked character itself says the clues; when you guess, the mask flies off ===== */
function qWho(q){let shown=1,wrong=0,solved=false;const opts=shuffle(q.options,L*5+C*11+6);const icons=lesson().icons||{};
  const now=()=>Math.max(0.3,1-(shown-1)*0.34-wrong*0.2);
  $("#q").innerHTML=frame(q,`<div class="mystery2" style="margin-top:34px"><span class="mysch" id="mch">${charHTML("mystery","🎭","happy")}</span><div class="saybox" id="say"></div></div>
    <div class="cluelist" id="clues"></div>
    <div class="row" style="margin-top:0;margin-bottom:10px;justify-content:space-between"><button class="btn ghost" id="more">🔍 تلميح كمان (-⭐)</button><span class="stars" id="now"></span></div>
    <div class="suspects" id="sus">${opts.map(id=>`<button class="sus" data-id="${id}" dir="auto">${charHTML(id,icons[id],"happy")}<span class="sname">${name(id)}</span><span class="bsay"></span></button>`).join("")}</div>`);
  const follow=ev=>lookAt($("#sus")||document.body,ev.clientX,ev.clientY);window.addEventListener("pointermove",follow);onCleanup(()=>window.removeEventListener("pointermove",follow));
  const paint=(fresh)=>{$("#clues").innerHTML=q.clues.map((c,i)=>i<shown?`<div class="cl${fresh&&i===shown-1?" new":""}">🔎 تلميح ${i+1}: ${c}</div>`:`<div class="cl hidden">🔒 تلميح ${i+1}</div>`).join("");
    $("#more").disabled=shown>=q.clues.length||solved;$("#now").textContent=solved?"":"لو حزرت هلأ: "+starStr(now());
    if(!solved){const s=$("#say");s.textContent="«"+q.clues[shown-1]+"»… مين أنا؟ 😏";s.classList.remove("pop2");void s.offsetWidth;s.classList.add("pop2");}};
  paint(false);$("#more").addEventListener("click",()=>{if(shown<q.clues.length){shown++;paint(true);sfx("pop");}});
  $("#q").querySelectorAll(".sus").forEach(b=>b.addEventListener("click",()=>{if(solved||b.classList.contains("out"))return;const id=b.dataset.id;
    if(id===q.target){solved=true;record(q.target,wrong?"partial":"correct");sfx("pop");b.classList.add("win","jump");setMood(b,"happy");b.querySelector(".bsay").textContent="هاد أنا! 😄";
      const mch=$("#mch");mch.classList.add("unmask");later(()=>{mch.innerHTML=charHTML(id,icons[id],"laugh");$("#say").textContent="كشفتني! أنا «"+name(id)+"» 😄";sfx("cheer");},450);
      const r=now();paint(false);fb("🕵️ «كشفتني! أنا "+name(id)+"»"+(shown===1&&!wrong?" من أول تلميح! 🤯":""),"good");
      later(()=>finish(q,r,q.clues.slice(0,shown).map((c,i)=>`تلميح ${i+1}: ${c}`).concat(q.solution)),900);}
    else{wrong++;record(q.target,"incorrect");b.querySelector(".bsay").textContent="مش أنا! 😅";setMood(b,"angry");b.classList.add("nope");later(()=>b.classList.add("out"),700);mascot("oops");
      const m=$("#mch .char");if(m){m.dataset.mood="laugh";later(()=>{if(!solved&&m)m.dataset.mood="happy";},900);}
      if(shown<q.clues.length){shown++;paint(true);$("#say").textContent="هههه قرّبت! اسمع: «"+q.clues[shown-1]+"» 😏";fb("مش هو… كشفتلك تلميح جديد 🔎","bad");}else{paint(false);fb("مش هو… جرّب غيره.","bad");}}}));}

/* ===== 13. اضبط — read the clue, set your guess, THEN see the plant (no live face while moving) ===== */
function qAdjust(q){const f=q.factor;let tries=0,solved=false;
  $("#q").innerHTML=frame(q,`${f.hint?`<div class="clue" style="margin-top:34px">📖 من الكتاب: ${f.hint}</div>`:""}
    <div class="adj"><div class="adjplant" id="ap">${garden()?alive("🌱"):charHTML(q.target,(lesson().icons||{})[q.target],"happy")}</div><div class="adjq" id="aq">🤔 شو رأيك؟</div></div>
    <div class="slider"><span>${f.min}</span><input type="range" id="sl" min="${f.min}" max="${f.max}" step="1" value="${f.start}" aria-label="${f.label}"><span>${f.max}</span></div>
    <div class="ov" id="ov">${f.start} ${f.unit}</div><div class="moodtxt" id="mt"></div><div class="row" style="justify-content:center"><button class="btn" id="try">${garden()?"🌱":"✅"} جرّب</button></div>`);
  const state=v=>v<f.ok_min?"low":v>f.ok_max?"high":"ok";
  $("#sl").addEventListener("input",()=>{$("#ov").textContent=$("#sl").value+" "+f.unit;$("#aq").textContent="🤔 شو رأيك؟";$("#ap").className="adjplant";$("#mt").textContent="";});
  $("#try").addEventListener("click",()=>{if(solved)return;tries++;const v=+$("#sl").value,st=state(v);record(q.target,st==="ok"?"correct":"incorrect");sfx("pop");
    const ap=$("#ap");ap.className="adjplant "+st;
    if(st==="ok"){solved=true;if(garden())ap.innerHTML=alive("🌻");setMood(ap,"laugh");$("#aq").textContent="🌻 يا سلام!";$("#mt").textContent="";fb((garden()?"النبتة مبسوطة! ":"مضبوط! ")+v+(f.unit?" "+f.unit:"")+" ✓","good");finish(q,tries===1?1:tries===2?0.6:0.3);}
    else{if(garden())ap.innerHTML=alive("🌱");else setMood(ap,st==="low"?"sad":"o");$("#aq").textContent=garden()?(st==="low"?"🥀 تعبانة…":"🫠 كثير عليها…"):(st==="low"?"⬇️ قليل…":"⬆️ كثير…");$("#mt").textContent=st==="low"?f.low:f.high;fb(st==="low"?"قليل… فكّر بالمعلومة فوق وزيد.":"كثير… فكّر بالمعلومة فوق ونقّص.","bad");mascot("oops");}});}

/* ===== dispatch + below + start ===== */
/* ===== 14. شو بيصير لو…؟ — cause and effect: the concept disappears and, like dominoes, whoever needs it gets tired ===== */
function qPredict(q){const icons=lesson().icons||{};const people=shuffle([q.target].concat(q.affected,q.unaffected),L*13+C*5+7);let wrong=0,solved=false;
  $("#q").innerHTML=frame(q,`<div class="village" id="vil" style="margin-top:34px">${people.map(id=>`<div class="villager" data-id="${id}">${charHTML(id,icons[id],"happy")}<span class="vname">${name(id)}</span><span class="bsay"></span></div>`).join("")}</div>
    <div class="opts" id="popts">${q.options.map((o,i)=>`<button class="opt" data-i="${i}" dir="auto">${o}</button>`).join("")}</div>`);
  const vil=id=>$("#q").querySelector(`.villager[data-id="${id}"]`);
  const domino=()=>{const t=vil(q.target);t.querySelector(".bsay").textContent="باي! 💨";t.classList.add("poof");sfx("whoosh");
    q.affected.forEach((id,i)=>later(()=>{const v=vil(id);setMood(v,"sad");v.classList.add("tired");v.querySelector(".bsay").textContent=i===0?"وين راح؟ 😢":"وأنا كمان! 😢";sfx("bad");},900+i*700));
    q.unaffected.forEach(id=>later(()=>{const v=vil(id);setMood(v,"laugh");v.querySelector(".bsay").textContent="أنا تمام 😎";},900+q.affected.length*700));};
  $("#q").querySelectorAll("#popts .opt").forEach(b=>b.addEventListener("click",()=>{if(solved||b.disabled)return;const ok=+b.dataset.i===q.answer;record(q.target,ok?"correct":"incorrect");
    if(ok){solved=true;b.classList.add("right");fb("✓ توقّعك صح! شوف…","good");domino();later(()=>finish(q,1/(1+wrong)),1600+q.affected.length*700);}
    else{wrong++;b.classList.add("nope","shake");b.disabled=true;mascot("oops");fb("مش هيك… فكّر: مين بيحتاج «"+name(q.target)+"»؟","bad");}}));}

function renderQ(){clearTimers();runCleanups();document.querySelectorAll(".drag-ghost,.ground-shadow").forEach(e=>e.remove());   /* nothing thrown in the last challenge stays on the screen */window.onresize=null;t0=performance.now();const q=concept().questions[Qi];if(!q){$("#q").innerHTML="<p class='small'>ما في تحديات لهالمفهوم.</p>";return;}
  const R={meaning:qMeaning,match:qMatch,memory:qMemory,spell:qSpell,true_false:qTrueFalse,sequence:qSequence,fix_chain:qFixChain,prereq:qPrereq,
    unlocks:qUnlocks,sort:qSort,odd_one_out:qOdd,who_am_i:qWho,predict:qPredict,adjust:qAdjust}[q.template];
  if(R)R(q);else $("#q").innerHTML="<p class='small'>نوع غير معروف: "+q.template+"</p>";}
function renderBelow(){const b=$("#below");if(tab==="file"){const l=lesson();b.innerHTML=`<p class="small">هاد الملف اللي المصنع حفظه للدرس: <code dir="ltr">lessons/${l.lesson_id}/questions.json</code></p><div class="code">${JSON.stringify(l,null,2).replace(/</g,"&lt;")}</div>`;}
  else{const e=evidence[evidence.length-1];b.innerHTML=`<p class="small">كل محاولة بتطلع دليل للمفهوم نفسه. العدد: <b>${evidence.length}</b>.</p><div class="code">${e?JSON.stringify(e,null,2):"// جاوب أي تحدي."}</div>`;}}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{tab=t.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));renderBelow();}));
function renderAll(){renderSide();renderWelcome();renderLesson();renderQ();renderBelow();}
$("#modeBtn").addEventListener("click",()=>{kid=!kid;document.body.classList.toggle("kid",kid);$("#modeBtn").textContent=kid?"⚙️ وضع المهندس":"👧 وضع الطالب";renderAll();});
$("#openAll").addEventListener("click",()=>{openAll=!openAll;const b=$("#openAll");b.textContent=openAll?"🔓 مفتوح":"🔒";b.setAttribute("aria-pressed",String(openAll));sfx(openAll?"click":"pop");renderAll();});
$("#soundBtn").addEventListener("click",()=>{soundOn=!soundOn;$("#soundBtn").textContent=soundOn?"🔊 الصوت":"🔇 الصوت";$("#soundBtn").setAttribute("aria-pressed",String(soundOn));beep(true);});
renderAll();
})();
